name: Mac

on:
  push:
    branches: "**"
    pull_request:
    tags:
      - "**"

jobs:
  build-mac:
    name: Build on Mac, Swift ${{ matrix.swift-version }}
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - swift-version: "5.9"
          - swift-version: "5.10"
    steps:
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: ${{ matrix.swift-version }}
      - run: swift --version
      - uses: actions/checkout@v4
      - run: swift build -c release

  test-mac:
